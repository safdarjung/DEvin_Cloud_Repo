# Scheduler reach for the hosted app: Vercel Hobby only allows a daily cron
# (vercel.json), so this calls the job runner once an hour. Scheduled and
# event-triggered workflow runs, notifications and reports are processed by
# /api/jobs/run (src/app/api/jobs/run/route.ts: GET or POST, header
# `Authorization: Bearer <CRON_SECRET>`). GitHub may delay or skip scheduled
# runs under load; manual "Run now" never depends on this.
#
# Repository secrets: APP_URL (e.g. https://your-app.vercel.app, no trailing
# slash) and CRON_SECRET (the same value as the Vercel env var).
name: Jobs cron

on:
  schedule:
    # Hourly on purpose: the repository is private and each run bills at least one Actions minute
    # (hourly is about 720 of the 2,000 free minutes a month; every 5 minutes would be about 8,600).
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: jobs-cron
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check secrets
        id: secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET is not set; skipping the job runner call."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call the job runner
        if: steps.secrets.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/jobs/run"
